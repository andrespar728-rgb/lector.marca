<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector Universal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{--bg:#0f172a;--p:#1e293b;--a:#38bdf8;--t:#e2e8f0;--m:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:12px}
h1{font-size:16px;margin:0;flex-shrink:0}
#fi{color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.btn{background:var(--p);color:var(--t);border:1px solid #334155;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.btn:active{background:var(--a);color:var(--bg)}
main{padding:16px;padding-bottom:80px}
#drop{border:2px dashed #475569;border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer}
#drop:active{border-color:var(--a);background:var(--p)}
#drop .ic{font-size:48px;display:block;margin-bottom:12px}
#drop p{margin:0}
#viewer{margin-top:16px}
#viewer img{max-width:100%;border-radius:8px;display:block;margin:0 auto;touch-action:pinch-zoom}
#viewer video{max-width:100%;border-radius:8px;display:block;margin:0 auto}
#viewer audio{width:100%}
pre{background:#0b1220;padding:12px;border-radius:8px;overflow:auto;font-size:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:16px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{border:1px solid #334155;padding:6px 10px;text-align:left;white-space:nowrap}
th{background:var(--p)}
.err{color:#f87171;font-size:14px;padding:20px;text-align:center}
.doc{background:#fff;color:#000;padding:16px;border-radius:8px;overflow-wrap:break-word;font-size:15px;line-height:1.5}
.doc img{max-width:100%;height:auto}
.loading{color:var(--m);text-align:center;padding:40px 0;font-size:14px}
.hexpreview{font-family:monospace;font-size:11px;color:var(--m)}
#epubv{background:#fff;border-radius:8px;height:calc(100vh - 220px);overflow:hidden}
</style>
</head>
<body>
<header>
<h1>📂 Lector</h1>
<span id="fi">Selecciona un archivo</span>
<button class="btn" id="pickBtn">Abrir</button>
</header>
<main>
<div id="drop">
<span class="ic">📄</span>
<p style="font-size:16px">Toca para abrir un archivo</p>
<p style="color:var(--m);font-size:12px;margin-top:6px">También desde Compartir de otras apps</p>
<input type="file" id="picker" hidden>
</div>
<div id="viewer"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

<script>
const drop=document.getElementById('drop'),picker=document.getElementById('picker'),
viewer=document.getElementById('viewer'),fileInfo=document.getElementById('fi'),
pickBtn=document.getElementById('pickBtn');
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if(window.marked)marked.setOptions({breaks:true,gfm:true});
const open=()=>picker.click();
drop.addEventListener('click',open);pickBtn.addEventListener('click',open);
picker.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0])});

const ext=n=>n.split('.').pop().toLowerCase();
const warn=m=>{viewer.innerHTML=`<p class="err">${m}</p>`};
const loading=()=>{viewer.innerHTML='<p class="loading">⏳ Procesando…</p>'};

async function handleFile(file){
  viewer.innerHTML='';
  fileInfo.textContent=`${file.name} · ${(file.size/1024).toFixed(0)} KB`;
  const e=ext(file.name),t=(file.type||'').toLowerCase();
  try{
    if(['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif'].includes(e))return showImg(file);
    if(['heic','heif'].includes(e)||t.includes('heic'))return showHEIC(file);
    if(['mp4','webm','mov','m4v','ogv','mkv','avi'].includes(e)||t.startsWith('video/'))return showVideo(file);
    if(['mp3','wav','ogg','m4a','flac','aac','opus'].includes(e)||t.startsWith('audio/'))return showAudio(file);
    if(e==='pdf')return showPDF(file);
    if(e==='docx')return showDocx(file);
    if(e==='doc')return showText(file,false);
    if(['xlsx','xls','ods'].includes(e))return showSheet(file);
    if(e==='csv')return showCSV(file);
    if(e==='pptx')return showPPTX(file);
    if(e==='ppt')return showText(file,false);
    if(e==='epub')return showEPUB(file);
    if(['md','markdown'].includes(e))return showMD(file);
    if(['html','htm'].includes(e))return showHTML(file);
    if(e==='json')return showJSON(file);
    if(e==='zip')return showZIP(file);
    if(['js','mjs','ts','tsx','jsx','py','java','c','cpp','h','hpp','cs','go','rs','rb','php','swift','kt','scala','sh','bash','zsh','sql','xml','yaml','yml','toml','ini','conf','css','scss','sass','less','vue','svelte','lua','pl','r','m','dart'].includes(e))return showText(file,true,e);
    if(t.startsWith('text/')||e==='txt'||e==='log')return showText(file,false);
    return showHex(file);
  }catch(err){warn('No se pudo leer: '+err.message)}
}

function showImg(file){const i=document.createElement('img');i.src=URL.createObjectURL(file);i.loading='lazy';viewer.appendChild(i)}
async function showHEIC(file){
  if(!window.heic2any)return showImg(file);
  loading();
  try{const o=await heic2any({blob:file,toType:'image/jpeg',quality:.85});
    viewer.innerHTML='';const i=document.createElement('img');
    i.src=URL.createObjectURL(Array.isArray(o)?o[0]:o);viewer.appendChild(i);
  }catch{showImg(file)}
}
function showVideo(file){const v=document.createElement('video');v.src=URL.createObjectURL(file);v.controls=true;v.playsInline=true;v.setAttribute('playsinline','');viewer.appendChild(v)}
function showAudio(file){const a=document.createElement('audio');a.src=URL.createObjectURL(file);a.controls=true;viewer.appendChild(a)}
async function showText(file,hl,lang){
  const c=document.createElement('code');c.textContent=await file.text();
  if(hl&&window.hljs){c.className='language-'+mapLang(lang);hljs.highlightElement(c)}
  const p=document.createElement('pre');p.appendChild(c);viewer.appendChild(p)
}
function mapLang(l){const m={js:'javascript',mjs:'javascript',ts:'typescript',tsx:'typescript',jsx:'javascript',py:'python',rs:'rust',rb:'ruby',sh:'bash',bash:'bash',zsh:'bash',yml:'yaml',kt:'kotlin',cs:'csharp',hpp:'cpp',vue:'html',svelte:'html'};return m[l]||l}
async function showJSON(file){
  const d=JSON.parse(await file.text());const c=document.createElement('code');
  c.textContent=JSON.stringify(d,null,2);
  if(window.hljs){c.className='language-json';hljs.highlightElement(c)}
  const p=document.createElement('pre');p.appendChild(c);viewer.appendChild(p)
}
async function showMD(file){
  const txt=await file.text();
  const html=window.marked?marked.parse(txt):txt.replace(/\n/g,'<br>');
  const safe=window.DOMPurify?DOMPurify.sanitize(html):html;
  const d=document.createElement('div');d.className='doc';d.innerHTML=safe;viewer.appendChild(d)
}
async function showHTML(file){
  const txt=await file.text();
  const bar=document.createElement('div');bar.style.cssText='display:flex;gap:8px;margin-bottom:12px';
  bar.innerHTML='<button class="btn active" data-m="r">Vista</button><button class="btn" data-m="s">Código</button>';
  viewer.appendChild(bar);const out=document.createElement('div');viewer.appendChild(out);
  const render=m=>{
    bar.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.dataset.m===m));
    if(m==='s'){out.innerHTML='';const c=document.createElement('code');c.textContent=txt;
      if(window.hljs){c.className='language-html';hljs.highlightElement(c)}
      const p=document.createElement('pre');p.appendChild(c);out.appendChild(p);
    }else{const f=document.createElement('iframe');f.style.cssText='width:100%;height:70vh;border:none;border-radius:8px;background:#fff';f.srcdoc=txt;out.innerHTML='';out.appendChild(f)}
  };
  bar.addEventListener('click',e=>{if(e.target.dataset.m)render(e.target.dataset.m)});
  render('r')
}
async function showPDF(file){
  if(!window.pdfjsLib)return warn('PDF.js no disponible');
  loading();const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  viewer.innerHTML='';const cont=document.createElement('div');viewer.appendChild(cont);
  const obs=new IntersectionObserver(async es=>{
    for(const en of es){
      if(!en.isIntersecting)continue;
      const el=en.target;if(el.dataset.r)continue;el.dataset.r='1';obs.unobserve(el);
      const pg=await pdf.getPage(+el.dataset.p);
      const base=pg.getViewport({scale:1});
      const sc=Math.min(2,(window.innerWidth-32)/base.width);
      const vp=pg.getViewport({scale:sc});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      cv.style.cssText='display:block;margin:8px auto;max-width:100%;border-radius:8px';
      el.replaceChildren(cv);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise
    }
  },{rootMargin:'400px'});
  for(let i=1;i<=pdf.numPages;i++){
    const ph=document.createElement('div');ph.dataset.p=i;
    ph.style.cssText='min-height:400px;background:#1e293b;margin:8px 0;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px';
    ph.textContent=`Página ${i} / ${pdf.numPages}`;cont.appendChild(ph);obs.observe(ph)
  }
}
async function showDocx(file){
  if(!window.mammoth)return warn('Mammoth no disponible');
  loading();const buf=await file.arrayBuffer();
  const r=await mammoth.convertToHtml({arrayBuffer:buf});
  viewer.innerHTML='';const d=document.createElement('div');d.className='doc';d.innerHTML=r.value;viewer.appendChild(d)
}
async function showSheet(file){
  if(!window.XLSX)return warn('SheetJS no disponible');
  loading();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  viewer.innerHTML='';
  wb.SheetNames.forEach(n=>{
    const h=document.createElement('h3');h.textContent=n;h.style.cssText='color:var(--a);font-size:14px';
    viewer.appendChild(h);const d=document.createElement('div');
    d.innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[n]);viewer.appendChild(d)
  })
}
async function showCSV(file){
  const rows=parseCSV(await file.text());const t=document.createElement('table');
  rows.forEach((r,i)=>{const tr=document.createElement('tr');
    r.forEach(c=>{const e=document.createElement(i===0?'th':'td');e.textContent=c;tr.appendChild(e)});
    t.appendChild(tr)});
  viewer.appendChild(t)
}
function parseCSV(text){
  const rows=[],row=[];let cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push([...row]);row.length=0;cur=''}
    else if(c!=='\r')cur+=c}}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows
}
async function showPPTX(file){
  if(!window.JSZip)return warn('JSZip no disponible');
  loading();const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  viewer.innerHTML='';if(!slides.length)return warn('PPTX sin diapositivas');
  const doc=document.createElement('div');doc.className='doc';
  for(let i=0;i<slides.length;i++){
    const xml=await zip.files[slides[i]].async('string');
    const dom=new DOMParser().parseFromString(xml,'application/xml');
    const txt=Array.from(dom.getElementsByTagName('a:t')).map(n=>n.textContent).join('\n');
    const b=document.createElement('div');b.style.cssText='margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #ddd';
    b.innerHTML=`<h3 style="color:#38bdf8;margin:0 0 8px">Diapositiva ${i+1}</h3><p style="margin:0;white-space:pre-wrap">${txt||'(sin texto)'}</p>`;
    doc.appendChild(b)
  }
  viewer.appendChild(doc)
}
async function showEPUB(file){
  if(!window.ePub)return warn('epub.js no disponible');
  loading();const book=ePub(await file.arrayBuffer());viewer.innerHTML='';
  const nav=document.createElement('div');nav.style.cssText='display:flex;gap:8px;margin-bottom:12px';
  nav.innerHTML='<button class="btn" id="ep">◀</button><button class="btn" id="en">▶</button>';
  viewer.appendChild(nav);
  const c=document.createElement('div');c.id='epubv';viewer.appendChild(c);
  const r=book.renderTo(c,{width:'100%',height:'100%'});await r.display();
  document.getElementById('ep').onclick=()=>r.prev();
  document.getElementById('en').onclick=()=>r.next()
}
async function showZIP(file){
  if(!window.JSZip)return warn('JSZip no disponible');
  loading();const zip=await JSZip.loadAsync(await file.arrayBuffer());
  viewer.innerHTML='';const ul=document.createElement('ul');
  ul.style.cssText='list-style:none;padding:0;margin:0;font-size:13px';
  Object.entries(zip.files).forEach(([n,e])=>{
    const li=document.createElement('li');
    li.style.cssText='padding:8px 12px;border-bottom:1px solid #334155';
    li.textContent=(e.dir?'📁 ':'📄 ')+n;ul.appendChild(li)
  });
  viewer.appendChild(ul)
}
async function showHex(file){
  const buf=await file.arrayBuffer();
  const bytes=new Uint8Array(buf.slice(0,1024));const lines=[];
  for(let i=0;i<bytes.length;i+=16){
    const chunk=Array.from(bytes.slice(i,i+16));
    const hex=chunk.map(b=>b.toString(16).padStart(2,'0')).join(' ');
    const asc=chunk.map(b=>b>=32&&b<127?String.fromCharCode(b):'.').join('');
    lines.push(i.toString(16).padStart(6,'0')+'  '+hex.padEnd(47)+'  '+asc)
  }
  viewer.innerHTML='';
  const note=document.createElement('p');note.style.cssText='color:var(--m);font-size:13px;margin-bottom:12px';
  note.textContent=`Vista hexadecimal (primeros ${bytes.length} bytes). Formato no renderizable.`;
  viewer.appendChild(note);
  const pre=document.createElement('pre');pre.className='hexpreview';
  pre.textContent=lines.join('\n');viewer.appendChild(pre)
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{})
}
</script>
</body>
</html>
